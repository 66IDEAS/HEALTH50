<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health50 - single screen mockup v2</title>
<style>
  :root {
    --font: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;

    /* iOS system colors, light */
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --secondary: rgba(60, 60, 67, .62);
    --tertiary: rgba(60, 60, 67, .32);
    --separator: rgba(60, 60, 67, .14);
    --fill: rgba(120, 120, 128, .12);
    --fill-strong: rgba(120, 120, 128, .22);
    --orange: #FF8D28;
    --red: #FF383C;
    --green: #34C759;
    --pink: #FF2D55;

    --page: #E7E7EC;
    --page-ink: #1C1C1E;
    --page-muted: #6B6B73;
    --page-card: #FFFFFF;
  }
  [data-theme="dark"] {
    --bg: #000000;
    --card: #1C1C1E;
    --label: #FFFFFF;
    --secondary: rgba(235, 235, 245, .62);
    --tertiary: rgba(235, 235, 245, .3);
    --separator: rgba(120, 120, 128, .32);
    --fill: rgba(120, 120, 128, .24);
    --fill-strong: rgba(120, 120, 128, .36);
    --orange: #FF9F0A;
    --red: #FF453A;
    --green: #30D158;
    --pink: #FF375F;

    --page: #121214;
    --page-ink: #F2F2F7;
    --page-muted: #9A9AA2;
    --page-card: #1C1C1E;
  }
  /* Health50 brand (66ideas brand kit): ink #16181D, blue #2E62E8 on light, #7A99F5 on dark, cream #F2EFE7 */
  :root {
    --accent: #2E62E8;        /* text, icons, tints */
    --accent-fill: #2E62E8;   /* filled buttons, switches, tiles (white content on top) */
    --accent2: #7A99F5;       /* gradient partner */
    --logo-ink: #16181D;
  }
  [data-theme="dark"] {
    --accent: #7A99F5;
    --accent-fill: #2E62E8;
    --accent2: #7A99F5;
    --logo-ink: #F2EFE7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font);
    background: var(--page);
    color: var(--page-ink);
    padding: 28px 16px 64px;
    transition: background .3s;
  }

  /* ---------- page chrome (not part of the app) ---------- */
  .page-head { max-width: 1340px; margin: 0 auto 30px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; justify-content: space-between; }
  .page-head h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .page-head p { font-size: 14px; color: var(--page-muted); margin-top: 4px; max-width: 620px; line-height: 1.4; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; }
  .seg { display: inline-flex; background: var(--page-card); border-radius: 12px; padding: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .seg button { font: 600 13px var(--font); color: var(--page-muted); border: 0; background: none; padding: 7px 13px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .seg button.active { background: var(--page); color: var(--page-ink); }
  .seg .dot { width: 11px; height: 11px; border-radius: 50%; }

  .gallery { display: flex; flex-wrap: wrap; gap: 44px 48px; justify-content: center; max-width: 1400px; margin: 0 auto; }
  .shot { width: 428px; }
  .shot figcaption { margin-top: 26px; padding: 0 14px; }
  .shot figcaption b { display: block; font-size: 15px; font-weight: 650; }
  .shot figcaption span { display: block; font-size: 13.5px; color: var(--page-muted); margin-top: 4px; line-height: 1.4; }

  /* ---------- device ---------- */
  .phone {
    position: relative;
    width: 402px; height: 874px;
    margin: 13px;
    border-radius: 62px;
    background: var(--bg);
    color: var(--label);
    overflow: hidden;
    box-shadow: 0 0 0 2px #2A2A2D, 0 0 0 11px #0A0A0C, 0 0 0 13px #48484D, 0 34px 60px -18px rgba(0,0,0,.42);
    transition: background .3s, color .3s;
  }
  .island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 19px; background: #000; z-index: 30; }
  .statusbar {
    position: absolute; inset: 0 0 auto 0; height: 62px; z-index: 20;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 21px 33px 0 51px;
    background: linear-gradient(var(--bg) 52%, transparent);
    pointer-events: none;
  }
  .statusbar .time { font-size: 17px; font-weight: 600; letter-spacing: -.3px; line-height: 22px; }
  .statusbar .sys { display: flex; align-items: center; gap: 7px; height: 22px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; width: 144px; height: 5px; margin-left: -72px; border-radius: 3px; background: var(--label); z-index: 30; }
  .bottom-fade { position: absolute; inset: auto 0 0 0; height: 44px; z-index: 20; background: linear-gradient(transparent, var(--bg) 78%); pointer-events: none; }

  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 62px 0 54px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }

  /* ---------- app: main screen ---------- */
  .title { padding: 14px 20px 14px; height: 57px; }
  .title svg { display: block; height: 25px; width: 165.7px; }

  .hero {
    margin: 0 16px; padding: 26px 20px 22px;
    background: var(--card); border-radius: 28px; text-align: center;
  }
  .ring { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; }
  .ring svg.r { position: absolute; inset: 0; width: 96px; height: 96px; }
  .ring .track { fill: none; stroke: var(--fill); stroke-width: 9; }
  .ring .prog { fill: none; stroke: url(#ringGrad); stroke-width: 9; stroke-linecap: round; }
  .ring .glow { position: absolute; inset: 10px; border-radius: 50%; box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 34%, transparent); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); }
  .ring .mid svg { width: 40px; height: 40px; }
  .ring .mid .pct { font-size: 22px; font-weight: 700; letter-spacing: -.4px; color: var(--label); font-variant-numeric: tabular-nums; }
  .ring .mid .pct small { font-size: 13px; font-weight: 600; color: var(--secondary); margin-left: 1px; }
  .ring.warn .prog { stroke: var(--orange); }
  .ring.warn .glow { box-shadow: 0 10px 26px color-mix(in srgb, var(--orange) 36%, transparent); }
  .ring.warn .mid { color: var(--orange); }
  .ring.idle .glow { display: none; }

  .hero h2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.2px; }
  .hero p { font-size: 15px; line-height: 20px; color: var(--secondary); margin-top: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; margin-top: 12px;
    border-radius: 15px; background: var(--fill); font-size: 13px; font-weight: 500; color: var(--secondary);
  }
  .pill svg { width: 15px; height: 14px; }

  .actions { margin: 14px 16px 0; display: grid; gap: 10px; }
  .btn {
    height: 52px; border-radius: 26px; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 17px/22px var(--font); letter-spacing: -.2px;
  }
  .btn svg { width: 21px; height: 21px; }
  .btn-primary { color: #fff; background: linear-gradient(180deg, var(--accent2) -90%, var(--accent-fill) 62%); box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 6px 16px -6px color-mix(in srgb, var(--accent-fill) 70%, transparent); }
  .btn-tinted { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .btn-warn { color: #fff; background: var(--orange); height: 44px; border-radius: 22px; font-size: 16px; margin: 16px auto 0; padding: 0 24px; display: inline-flex; }
  .btn[disabled] { opacity: .38; cursor: default; box-shadow: none; }

  .sec-head { font-size: 16px; line-height: 22px; font-weight: 650; padding: 26px 32px 8px; letter-spacing: -.2px; }
  .group { margin: 0 16px; background: var(--card); border-radius: 26px; overflow: hidden; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; font-size: 17px; letter-spacing: -.3px; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 58px; right: 16px; height: .5px; background: var(--separator); }
  .row .lbl { flex: 1; min-width: 0; }
  .row .val { color: var(--secondary); white-space: nowrap; }
  .row .val.warn { color: var(--orange); font-weight: 500; }
  .row .chev { width: 8px; height: 14px; color: var(--tertiary); flex: none; margin-left: -4px; }
  .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .tile svg { width: 19px; height: 19px; }
  .tile.white { background: #fff; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.14); }
  .sec-foot { font-size: 13px; line-height: 18px; color: var(--secondary); padding: 8px 32px 0; }

  .switch { width: 64px; height: 28px; border-radius: 14px; background: var(--fill-strong); position: relative; transition: background .25s; flex: none; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 38px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.05); transition: transform .28s cubic-bezier(.3,1.35,.5,1); }
  .switch.on { background: var(--accent-fill); }
  .switch.on::after { transform: translateX(22px); }

  .stepper { display: flex; height: 32px; border-radius: 16px; background: var(--fill); flex: none; }
  .stepper button { width: 46px; border: 0; background: none; color: var(--label); font: 400 22px/30px var(--font); cursor: pointer; position: relative; }
  .stepper button + button::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: .5px; background: var(--tertiary); }
  .stepper button:disabled { color: var(--tertiary); cursor: default; }

  .section[data-auto="off"] .dep, .section[data-auto="off"] .foot-on, .section[data-auto="on"] .foot-off { display: none; }

  .privacy { display: flex; gap: 9px; align-items: flex-start; margin: 26px 32px 0; font-size: 13px; line-height: 18px; color: var(--secondary); }
  .privacy svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }

  /* ---------- app: welcome ---------- */
  .welcome { position: absolute; inset: 0; padding: 62px 0 34px; display: flex; flex-direction: column; }
  .appicon {
    display: block; width: 96px; height: 96px; border-radius: 21.5px; margin: 44px auto 0;
    box-shadow: 0 16px 32px -12px rgba(22, 24, 29, .55), 0 0 0 .5px rgba(255,255,255,.14);
  }
  .welcome .lockup { display: block; width: 244px; height: 61.2px; margin: 30px auto 0; }
  .features { margin: 44px 36px 0; display: grid; gap: 24px; }
  .feat { display: flex; gap: 16px; align-items: flex-start; }
  .feat svg { width: 34px; height: 34px; color: var(--accent); flex: none; margin-top: 2px; }
  .feat b { display: block; font-size: 15px; line-height: 20px; font-weight: 650; }
  .feat span { display: block; font-size: 15px; line-height: 20px; color: var(--secondary); }
  .welcome .bottom { margin-top: auto; padding: 0 24px 16px; }
  .welcome .note { font-size: 13px; line-height: 18px; color: var(--secondary); text-align: center; padding: 0 12px 16px; }
</style>
</head>

<script>
  // device chrome for every phone
  const chrome = `
    <div class="island"></div>
    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="sys">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3.2" height="4.5" rx="1"/><rect x="4.9" y="5" width="3.2" height="7" rx="1"/><rect x="9.8" y="2.5" width="3.2" height="9.5" rx="1"/><rect x="14.7" y="0" width="3.2" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.4a10 10 0 0114 0"/><path d="M4.2 7.2a6.2 6.2 0 018.6 0"/><circle cx="8.5" cy="10.2" r="1.3" fill="currentColor" stroke="none"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.4c.9.3 1.5 1.1 1.5 2.100S25.900 8.300 25 8.600z" fill="currentColor" opacity=".45"/></svg>
      </div>
    </div>
    <div class="bottom-fade"></div>
    <div class="home-ind"></div>`;
  document.querySelectorAll('.phone').forEach(p => p.insertAdjacentHTML('beforeend', chrome));

  // page switchers (theme, accent)
  document.querySelectorAll('.seg').forEach(seg => {
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      document.documentElement.dataset[seg.dataset.set] = b.dataset.v;
    });
  });

  // live switches; the automatic export switch unfolds its settings
  document.querySelectorAll('.switch').forEach(sw => {
    sw.addEventListener('click', () => {
      const on = sw.classList.toggle('on');
      if (sw.dataset.role === 'auto') sw.closest('.section').dataset.auto = on ? 'on' : 'off';
    });
  });

  // day stepper, minimum 1 day
  document.querySelectorAll('.stepper').forEach(st => {
    const out = st.parentElement.querySelector('[data-days]');
    let days = 1;
    st.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      days = Math.max(1, days + Number(b.dataset.step));
      out.textContent = days + (days === 1 ? ' day' : ' days');
      st.querySelector('[data-step="-1"]').disabled = days === 1;
    });
  });
</script>
