<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health50 - analysis dashboard mockup v1</title>
<script>
  // Follows the computer's appearance. The mockup bar (or ?theme=dark / ?theme=light) overrides it.
  (function () {
    var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
    function apply(pref) { root.dataset.pref = pref; root.dataset.theme = pref === 'auto' ? (mq.matches ? 'dark' : 'light') : pref; }
    var q = new URLSearchParams(location.search).get('theme');
    apply(q === 'dark' || q === 'light' ? q : 'auto');
    mq.addEventListener('change', function () { if (root.dataset.pref === 'auto') apply('auto'); });
    window.setAppearance = apply;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --font: -apple-system, "SF Pro Text", system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --secondary: rgba(60, 60, 67, .68);
    --muted: #85858B;
    --separator: rgba(60, 60, 67, .14);
    --fill: rgba(120, 120, 128, .12);

    /* Health50 brand */
    --accent: #2E62E8;
    --accent-fill: #2E62E8;
    --logo-ink: #16181D;

    /* ratings: always a word plus a color */
    --good: #2E62E8;
    --watch: #F07A12;
    --act: #E5302F;
    --none: #8E8E93;

    /* chart series (checked for color blindness against the card color) */
    --s1: #2E62E8;
    --s2: #1BAF7A;
    --s3: #6250D6;
    --s4: #B9B9C0;
    --band: rgba(46, 98, 232, .13);
    --grid: #ECECF0;
    --axis: #CDCDD3;
    --guide: #55555C;

    /* one hue, light to dark, for values per day */
    --q0: #ECECF1; --q1: #D6E0FB; --q2: #A9BFF7; --q3: #7092F0; --q4: #2E62E8; --q5: #173C9E;

    /* sleep stages */
    --st-deep: #173C9E; --st-core: #2E62E8; --st-rem: #9DB4F7; --st-awake: #CFCFD5;
    --on-deep: #FFFFFF; --on-core: #FFFFFF; --on-rem: #0B0B0B; --on-awake: #0B0B0B;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --card: #1C1C1E;
    --label: #FFFFFF;
    --secondary: rgba(235, 235, 245, .68);
    --muted: #8E8E93;
    --separator: rgba(120, 120, 128, .32);
    --fill: rgba(120, 120, 128, .24);

    --accent: #7A99F5;
    --logo-ink: #F2EFE7;

    --good: #7A99F5;
    --watch: #FF9F0A;
    --act: #FF453A;
    --none: #8E8E93;

    --s1: #6388F3;
    --s2: #199E70;
    --s3: #9085E9;
    --s4: #5E5E66;
    --band: rgba(122, 153, 245, .17);
    --grid: #2A2A2D;
    --axis: #3D3D42;
    --guide: #C4C4CC;

    --q0: #2A2A2E; --q1: #1D2A57; --q2: #27418F; --q3: #2E62E8; --q4: #7A99F5; --q5: #C5D2FB;

    --st-deep: #2449B8; --st-core: #5C82F0; --st-rem: #A9BDF9; --st-awake: #5A5A61;
    --on-deep: #FFFFFF; --on-core: #FFFFFF; --on-rem: #0B0B0B; --on-awake: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body { font: 15px/1.4 var(--font); background: var(--bg); color: var(--label); }
  a { color: inherit; text-decoration: none; }
  button, select { font: inherit; color: inherit; }

  /* ---------- mockup bar (not part of the dashboard) ---------- */
  .mockbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 8px 16px; font-size: 12.5px; color: var(--secondary); border-bottom: 1px dashed var(--separator); }
  .seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--secondary); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--label); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-bottom: 1px solid var(--separator); }
  .top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { height: 22px; width: auto; display: block; flex: none; }
  .runs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .runs button { flex: none; width: 34px; height: 34px; border-radius: 17px; border: 0; background: var(--card); color: var(--accent); cursor: pointer; display: grid; place-items: center; }
  .runs button:disabled { color: var(--muted); opacity: .5; cursor: default; }
  .runs button svg { width: 16px; height: 16px; }
  .runs select { height: 34px; border-radius: 17px; border: 0; background: var(--card); padding: 0 12px; font-weight: 600; font-size: 14px; cursor: pointer; min-width: 0; flex: 0 1 auto; text-overflow: ellipsis; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 40px; }

  /* ---------- hero ---------- */
  .hero h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.4px; max-width: 760px; text-wrap: balance; }
  .hero .meta { margin-top: 8px; font-size: 13.5px; color: var(--secondary); }
  .tally { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tally .blocks { display: flex; gap: 2px; margin-right: 6px; }
  .tally .blocks i { width: 18px; height: 8px; border-radius: 4px; }

  /* ---------- ratings ---------- */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--label); background: color-mix(in srgb, var(--c) 15%, transparent); }
  .pill svg { width: 15px; height: 15px; color: var(--c); flex: none; }
  .pill b { font-weight: 700; margin-right: 1px; }
  .good { --c: var(--good); } .watch { --c: var(--watch); } .act { --c: var(--act); } .none { --c: var(--none); }
  .pill.none { color: var(--secondary); }

  /* ---------- cards ---------- */
  .card { background: var(--card); border-radius: 20px; padding: 16px; }
  .tiles { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: transform .15s; }
  .tile:hover { transform: translateY(-2px); }
  .tile h3 { font-size: 14px; font-weight: 600; color: var(--secondary); }
  .tile .pill { align-self: flex-start; }
  .num { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
  .num b { font-size: 25px; font-weight: 650; letter-spacing: -.4px; line-height: 1.1; }
  .num .u { font-size: 12.5px; color: var(--secondary); }
  .tile .empty { font-size: 12.5px; color: var(--muted); flex: 1; }
  .delta { font-size: 12.5px; color: var(--secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .delta i { font-style: normal; font-size: 9px; margin-right: 3px; position: relative; top: -1px; }
  .delta.better i { color: var(--good); } .delta.worse i { color: var(--watch); }

  .spark { position: relative; display: block; height: 30px; margin-top: auto; }
  .spark svg { position: absolute; inset: 0 5px 0 0; width: calc(100% - 5px); height: 100%; overflow: visible; }
  .spark path { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .spark i { position: absolute; right: 0; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--s1); border: 2px solid var(--card); }
  .spark.gray path { stroke: var(--none); } .spark.gray i { background: var(--none); }

  /* ---------- doctor card ---------- */
  .doctor { margin-top: 12px; display: flex; gap: 14px; align-items: flex-start; border: 1.5px solid color-mix(in srgb, var(--act) 55%, transparent); background: color-mix(in srgb, var(--act) 7%, var(--card)); }
  .doctor > svg { width: 30px; height: 30px; color: var(--act); flex: none; }
  .doctor h2 { font-size: 16px; font-weight: 650; }
  .doctor ul { margin-top: 6px; padding-left: 18px; font-size: 14px; }
  .doctor li { margin-top: 3px; }

  h2.sec { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .sec-head { margin: 34px 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; scroll-margin-top: 70px; }
  .sec-head p { flex-basis: 100%; font-size: 14px; color: var(--secondary); }

  /* ---------- recommendations ---------- */
  .recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .rec { display: flex; flex-direction: column; gap: 12px; }
  .rec-top { display: flex; gap: 10px; align-items: flex-start; }
  .rec-n { flex: none; width: 26px; height: 26px; border-radius: 13px; background: var(--accent-fill); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
  .rec p { font-size: 15.5px; font-weight: 600; line-height: 1.3; }
  .rec-nums { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-end; }
  .rec-nums div span { display: block; font-size: 12px; color: var(--secondary); }
  .rec-nums div { white-space: nowrap; }
  .rec-nums div b { font-size: 20px; font-weight: 650; letter-spacing: -.3px; }
  .rec-nums small { font-size: 12px; color: var(--secondary); }
  .rec-nums .spark { flex: 1; min-width: 60px; margin: 0; }
  .meter { height: 8px; border-radius: 4px; background: var(--band); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--s1); }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 99px; background: color-mix(in srgb, var(--c) 15%, transparent); }
  .chip i { font-style: normal; color: var(--c); font-size: 13px; line-height: 1; }
  .chip span { font-weight: 400; color: var(--secondary); }

  /* ---------- chart cards ---------- */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid2 .wide { grid-column: 1 / -1; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ch h3 { font-size: 14px; font-weight: 600; color: var(--secondary); }
  .ch .num { margin-top: 2px; }
  .tb { border: 0; background: var(--fill); border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--secondary); cursor: pointer; flex: none; }
  .tb[aria-expanded="true"] { background: var(--accent-fill); color: #fff; }
  .note { margin-top: 4px; font-size: 13px; color: var(--secondary); }
  .plot { margin-top: 12px; min-width: 0; }
  .plot svg { display: block; touch-action: pan-y; overflow: visible; cursor: crosshair; }
  .legend { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--secondary); }
  .legend:empty { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { flex: none; }
  .k-line { width: 14px; height: 2px; border-radius: 1px; background: var(--s1); }
  .k-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--s1); opacity: .45; }
  .k-band { width: 14px; height: 9px; border-radius: 2px; background: var(--band); }
  .k-guide { width: 14px; height: 0; border-top: 1.5px dashed var(--guide); }
  .k-sw { width: 10px; height: 10px; border-radius: 3px; }
  .tbl { margin-top: 10px; max-height: 230px; overflow: auto; border-top: 1px solid var(--separator); }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--separator); white-space: nowrap; }
  .tbl th { position: sticky; top: 0; background: var(--card); color: var(--secondary); font-weight: 600; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }

  /* marks */
  .ax { font: 11px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .gl { font: 600 11px var(--font); fill: var(--guide); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
  .gridl { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--axis); stroke-width: 1; }
  .bandr { fill: var(--band); }
  .dots circle { fill: var(--s1); opacity: .3; }
  .guide { stroke: var(--guide); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .enddot { fill: var(--s1); stroke: var(--card); stroke-width: 2; }
  .cross { stroke: var(--axis); stroke-width: 1; }
  .hov { fill: var(--fill); }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f4 { fill: var(--s4); }
  .c0 { fill: var(--q0); } .c1 { fill: var(--q1); } .c2 { fill: var(--q2); } .c3 { fill: var(--q3); } .c4 { fill: var(--q4); } .c5 { fill: var(--q5); }
  .cellhov { fill: none; stroke: var(--label); stroke-width: 1.5; }

  .segbar { display: flex; gap: 2px; height: 28px; }
  .segbar div { border-radius: 4px; min-width: 3px; padding: 0 8px; font-size: 12.5px; font-weight: 600; line-height: 28px; white-space: nowrap; overflow: visible; }

  .nodata { display: flex; gap: 12px; align-items: center; color: var(--secondary); font-size: 14px; }
  .nodata svg { width: 28px; height: 28px; color: var(--none); flex: none; }

  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--card); color: var(--label); border-radius: 12px; padding: 8px 11px; font-size: 12.5px; box-shadow: 0 0 0 1px var(--separator), 0 8px 24px rgba(0, 0, 0, .18); min-width: 110px; }
  #tip .th { color: var(--secondary); margin-bottom: 2px; }
  #tip .tr { display: flex; align-items: center; gap: 6px; }
  #tip .tr i { width: 10px; height: 2px; border-radius: 1px; flex: none; }
  #tip .tr b { font-weight: 650; font-variant-numeric: tabular-nums; }
  #tip .tr span { color: var(--secondary); }

  footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--separator); font-size: 12.5px; color: var(--secondary); }
  footer strong { color: var(--label); font-weight: 600; font-size: 13.5px; }
  footer ul { margin-top: 8px; list-style: none; columns: 2 320px; column-gap: 28px; }
  footer li { margin-top: 3px; break-inside: avoid; }

  @media (max-width: 520px) {
    .hero h1 { font-size: 23px; }
    .card { border-radius: 18px; padding: 14px; }
    .logo { height: 19px; }
  }
</style>
</head>

<div class="mockbar">
  <span>Mockup v1 of the analysis dashboard. All numbers are made up for a fictional person. In the real dashboard, every run is its own page.</span>
  <div class="seg" id="appearance" role="group" aria-label="Appearance">
    <button type="button" data-v="auto">Auto</button><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <svg class="logo" viewBox="6.8 29.4 474.5 71.6" role="img" aria-label="Health50"><use href="#logo"/></svg>
    <nav class="runs" aria-label="Runs">
      <button type="button" id="prev" aria-label="Previous run"><svg><use href="#i-prev"/></svg></button>
      <select id="runsel" aria-label="All runs"></select>
      <button type="button" id="next" aria-label="Next run"><svg><use href="#i-next"/></svg></button>
    </nav>
  </div>
</header>

<main id="main"></main>
<div id="tip" hidden></div>

<script>
(function () {
  'use strict';

  /* ================= sample data (made up, the same on every load) ================= */
  const DAY = 864e5, MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const T0 = Date.UTC(2025, 6, 1), N = Math.round((Date.UTC(2026, 10, 6) - T0) / DAY) + 1;
  const date = i => new Date(T0 + i * DAY);
  const idx = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - T0) / DAY);
  const RUNS = [{ i: idx(2026, 8, 3) }, { i: idx(2026, 9, 7) }, { i: idx(2026, 11, 6) }];
  const HEIGHT = 1.80, GOAL_KG = 80;

  let seed = 50;
  const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const g = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); };
  const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);

  const M = { steps: [], exmin: [], rhr: [], hrv: [], bed: [], wake: [], sleep: [], deep: [], rem: [], awake: [], vo2: [], weight: [], speed: [], asym: [], db: [], light: [], wo: [] };
  const illA = idx(2026, 2, 9), better = idx(2026, 9, 7);
  for (let i = 0; i < N; i++) {
    const d = date(i), dow = d.getUTCDay(), p = i / (N - 1);
    const s = Math.cos(2 * Math.PI * ((d - Date.UTC(d.getUTCFullYear(), 0, 1)) / DAY - 15) / 365);   // +1 in mid January, -1 in mid July
    const w = { run: 0, ride: 0, str: 0, oth: 0 };
    if (R() < (dow === 2 || dow === 4 || dow === 6 ? .55 : .04)) w.run = Math.max(20, Math.round(38 + g() * 9 + (dow === 6 ? 18 : 0)));
    if (R() < (dow === 0 ? .62 - .3 * Math.max(0, s) : .05)) w.ride = Math.max(30, Math.round(75 + g() * 20));
    if (R() < (dow === 1 ? .32 : .02)) w.str = Math.max(20, Math.round(35 + g() * 6));
    if (R() < .03) w.oth = Math.max(15, Math.round(30 + g() * 8));
    const wmin = w.run + w.ride + w.str + w.oth;
    M.wo.push(w);
    M.steps.push(Math.max(1200, Math.round(7300 + 1100 * p - 900 * s + (dow === 6 ? 1300 : dow === 0 ? -700 : 0) + g() * 1700 + w.run * 95)));
    M.exmin.push(Math.max(0, Math.round(8 + g() * 6 + wmin * .62)));
    const ill = i >= illA && i <= illA + 8 ? 6 * Math.sin(Math.PI * (i - illA) / 8) : 0;
    M.rhr.push(59.5 - 2.4 * p + s + ill + g() * 1.2);
    M.hrv.push(40 + 3.5 * p - ill * 1.5 + g() * 5.5);
    const late = dow === 5 || dow === 6;
    const bed = 23.9 + (late ? .9 : 0) + (i > better ? -.5 : 0) + g() * .6, wake = 6.5 + (late ? 1.2 : 0) + g() * .35, awake = .3 + Math.abs(g()) * .15;
    const sl = wake + 24 - bed - awake;
    M.bed.push(bed); M.wake.push(wake); M.sleep.push(sl); M.awake.push(awake);
    M.deep.push(sl * (.14 + g() * .02)); M.rem.push(sl * (.22 + g() * .025));
    M.vo2.push(w.run ? 41 + 2.3 * p + g() * .3 : null);
    M.weight.push(R() < .45 ? 85.6 - 3.6 * p + g() * .3 : null);
    M.speed.push(4.95 + .15 * p + g() * .14);
    M.asym.push(Math.max(0, 1.6 + g() * .7));
    M.db.push(R() < .8 ? 70.5 + g() * 3.5 : null);
    M.light.push(Math.max(3, 50 - 28 * s + g() * 14 + (w.ride ? 25 : 0)));
  }
  const BP = ['2025-08-20', '2025-09-14', '2025-10-19', '2025-11-23', '2025-12-28', '2026-01-25', '2026-02-22', '2026-03-15', '2026-04-12', '2026-05-17', '2026-06-14', '2026-07-05', '2026-07-19', '2026-08-11', '2026-08-16', '2026-08-23', '2026-08-30', '2026-09-04', '2026-09-20', '2026-10-25']
    .map(t => ({ i: Math.round((Date.parse(t) - T0) / DAY), sys: Math.round(131 + g() * 7), dia: Math.round(82 + g() * 5) }));

  /* ================= formatting ================= */
  const int = n => Math.round(n).toLocaleString('en-US');
  const f1 = n => n.toFixed(1);
  const dstr = d => d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  const dshort = d => d.getUTCDate() + ' ' + MON[d.getUTCMonth()];
  const hm = h => { const m = Math.round(h * 60); return (m / 60 | 0) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; };
  const clock = h => { const m = Math.round(((h % 24) + 24) % 24 * 60) % 1440; return String(m / 60 | 0).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  /* ================= the numbers of one run ================= */
  function analyse(ri) {
    const e = RUNS[ri].i, s = e - 364, sl = a => a.slice(s, e + 1);
    const dates = []; for (let i = s; i <= e; i++) dates.push(date(i));
    const last = (a, n) => mean(a.slice(e - n + 1, e + 1).filter(v => v != null));
    let j = e; while (date(j).getUTCDay() !== 0) j--;
    const wk = []; for (let k = 51; k >= 0; k--) wk.push({ a: j - 7 * k - 6, b: j - 7 * k, start: date(j - 7 * k - 6) });
    const wsum = (a, w) => { let t = 0; for (let i = w.a; i <= w.b; i++) t += a[i] || 0; return t; };
    const wmean = (a, w) => { const v = []; for (let i = w.a; i <= w.b; i++) if (a[i] != null) v.push(a[i]); return v.length ? mean(v) : null; };
    const roll = a => { const o = []; for (let i = s; i <= e; i++) { const v = []; for (let q = Math.max(0, i - 6); q <= i; q++) if (a[q] != null) v.push(a[q]); o.push(v.length ? mean(v) : null); } return o; };
    const band = a => { const v = a.filter(x => x != null).sort((x, y) => x - y); return [v[Math.floor(v.length * .1)], v[Math.floor(v.length * .9)]]; };
    const sessions = (w, key) => { let c = 0; for (let i = w.a; i <= w.b; i++) { const o = M.wo[i]; c += key ? (o[key] > 0) : (o.run > 0) + (o.ride > 0) + (o.str > 0) + (o.oth > 0); } return c; };
    const w12 = wk.slice(-12);
    const bp = BP.filter(b => b.i >= s && b.i <= e);
    return {
      e, s, sl, dates, wk, wsum, wmean, roll, band, bp,
      steps: last(M.steps, 30), rhr: last(M.rhr, 30), hrv: last(M.hrv, 30), sleep: last(M.sleep, 30),
      bed: last(M.bed, 30), wake: last(M.wake, 30), vo2: last(M.vo2, 30), weight: last(M.weight, 14),
      speed: last(M.speed, 30), asym: last(M.asym, 30), db: last(M.db, 30), light: last(M.light, 30),
      exmin: mean(w12.map(w => wsum(M.exmin, w))),
      wo: mean(w12.map(w => sessions(w))), str: mean(w12.map(w => sessions(w, 'str'))),
      bp30: BP.filter(b => b.i > e - 30 && b.i <= e).length,
      sys: mean(bp.map(b => b.sys)), dia: mean(bp.map(b => b.dia)), bpHigh: bp.filter(b => b.sys >= 130 || b.dia >= 80).length,
      sessions
    };
  }

  /* ================= small building blocks ================= */
  const SVG = 'http://www.w3.org/2000/svg';
  const sv = (t, a, p) => { const e = document.createElementNS(SVG, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const tx = (p, x, y, s, cls, anchor) => { const t = sv('text', { x, y, class: cls || 'ax', 'text-anchor': anchor || 'start' }, p); t.textContent = s; return t; };
  const div = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d; };
  function ticks(lo, hi, n) {
    const raw = ((hi - lo) || 1) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const t = []; for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 1e6; v += step) t.push(+v.toFixed(6)); return t;
  }
  const tfmt = tk => { const dec = tk.some(t => t % 1) ? 1 : 0; return t => t >= 10000 ? (t / 1000) + 'K' : dec ? t.toFixed(1) : int(t); };
  function xLabels(svg, items, y, W, minGap) {
    if (!items.length) return;
    const gap = items.length > 1 ? (items[items.length - 1].x - items[0].x) / (items.length - 1) : 999, step = Math.max(1, Math.ceil((minGap || 27) / gap));
    items.forEach((o, i) => { if ((items.length - 1 - i) % step === 0 && o.x < W - 8 && o.x > 22) tx(svg, o.x, y, o.t, 'ax', 'middle'); });
  }
  const months = (dates, X) => dates.map((d, i) => d.getUTCDate() === 1 ? { x: X(i), t: MON[d.getUTCMonth()] } : null).filter(Boolean);

  const tip = document.getElementById('tip');
  function showTip(ev, head, rows) {
    tip.replaceChildren();
    const h = document.createElement('div'); h.className = 'th'; h.textContent = head; tip.append(h);
    rows.forEach(r => {
      const d = document.createElement('div'); d.className = 'tr';
      if (r.c) { const k = document.createElement('i'); k.style.background = r.c; d.append(k); }
      const b = document.createElement('b'); b.textContent = r.v; const sp = document.createElement('span'); sp.textContent = r.k || ''; d.append(b, sp); tip.append(d);
    });
    tip.hidden = false;
    const w = tip.offsetWidth, hh = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + hh > innerHeight - 8) y = ev.clientY - hh - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  function hover(svg, fn, clear) { svg.addEventListener('pointermove', fn); svg.addEventListener('pointerdown', fn); svg.addEventListener('pointerleave', () => { tip.hidden = true; clear(); }); }

  /* ================= charts ================= */
  // Line over time, with the user's usual range as a band and guidelines as dashed lines.
  function lineChart(host, o) {
    const W = host.clientWidth, H = o.h || 180, m = { l: 36, r: 8, t: 10, b: 20 }, n = o.dates.length;
    const svg = sv('svg', { width: W, height: H, role: 'img', 'aria-label': o.label });
    const pts = []; o.y.forEach((v, i) => { if (v != null) pts.push(i); });
    let all = o.y.filter(v => v != null); if (o.dots) all = all.concat(o.dots.filter(v => v != null));
    let lo = Math.min(...all), hi = Math.max(...all);
    if (o.band) { lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
    (o.guides || []).forEach(q => { lo = Math.min(lo, q.v); hi = Math.max(hi, q.v); });
    const tk = ticks(lo, hi, 4), tf = o.tick || tfmt(tk); lo = tk[0]; hi = tk[tk.length - 1];
    const pw = W - m.l - m.r, ph = H - m.t - m.b, X = i => m.l + pw * i / (n - 1), Y = v => m.t + ph * (1 - (v - lo) / (hi - lo));
    tk.forEach((t, k) => { sv('line', { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: k ? 'gridl' : 'base' }, svg); tx(svg, m.l - 6, Y(t) + 3.5, tf(t), 'ax', 'end'); });
    xLabels(svg, months(o.dates, X), H - 4, W);
    if (o.band) sv('rect', { x: m.l, width: pw, y: Y(o.band[1]), height: Y(o.band[0]) - Y(o.band[1]), rx: 3, class: 'bandr' }, svg);
    if (o.dots) { const q = sv('g', { class: 'dots' }, svg); o.dots.forEach((v, i) => { if (v != null) sv('circle', { cx: X(i).toFixed(1), cy: Y(v).toFixed(1), r: 1.3 }, q); }); }
    (o.guides || []).forEach(q => { sv('line', { x1: m.l, x2: W - m.r, y1: Y(q.v), y2: Y(q.v), class: 'guide' }, svg); tx(svg, W - m.r - 2, Y(q.v) + (Y(q.v) - m.t > 18 ? -6 : 14), q.label, 'gl', 'end'); });
    sv('path', { d: pts.map((i, k) => (k ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(o.y[i]).toFixed(1)).join(''), class: 'line' }, svg);
    const li = pts[pts.length - 1]; sv('circle', { cx: X(li), cy: Y(o.y[li]), r: 4, class: 'enddot' }, svg);
    const cr = sv('line', { y1: m.t, y2: H - m.b, class: 'cross', visibility: 'hidden' }, svg), cd = sv('circle', { r: 4, class: 'enddot', visibility: 'hidden' }, svg);
    hover(svg, ev => {
      const f = (ev.clientX - svg.getBoundingClientRect().left - m.l) / pw * (n - 1); let b = pts[0]; for (const i of pts) if (Math.abs(i - f) < Math.abs(b - f)) b = i;
      cr.setAttribute('x1', X(b)); cr.setAttribute('x2', X(b)); cr.setAttribute('visibility', 'visible');
      cd.setAttribute('cx', X(b)); cd.setAttribute('cy', Y(o.y[b])); cd.setAttribute('visibility', 'visible');
      showTip(ev, dstr(o.dates[b]), o.tip(b));
    }, () => { cr.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); });
    host.replaceChildren(svg);
  }

  // Bars per week, one series or stacked.
  function barChart(host, o) {
    const W = host.clientWidth, H = o.h || 180, m = { l: 36, r: 8, t: 10, b: 20 }, n = o.starts.length;
    const svg = sv('svg', { width: W, height: H, role: 'img', 'aria-label': o.label });
    const tot = o.stacks.map(a => a.reduce((s, v) => s + v, 0));
    let hi = Math.max(...tot); (o.guides || []).forEach(q => { hi = Math.max(hi, q.v); });
    const tk = ticks(0, hi, 4), tf = tfmt(tk); hi = tk[tk.length - 1];
    const pw = W - m.l - m.r, ph = H - m.t - m.b, sw = pw / n, bw = Math.min(24, Math.max(2, sw - 2)), Y = v => m.t + ph * (1 - v / hi);
    tk.forEach((t, k) => { sv('line', { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: k ? 'gridl' : 'base' }, svg); tx(svg, m.l - 6, Y(t) + 3.5, tf(t), 'ax', 'end'); });
    xLabels(svg, o.starts.map((d, i) => d.getUTCDate() <= 7 ? { x: m.l + sw * (i + .5), t: MON[d.getUTCMonth()] } : null).filter(Boolean), H - 4, W);
    const hv = sv('rect', { y: m.t, height: ph, width: sw, class: 'hov', visibility: 'hidden' }, svg);
    o.stacks.forEach((a, i) => {
      const x = m.l + sw * i + (sw - bw) / 2; let y = Y(0), topS = -1; a.forEach((v, k) => { if (v > 0) topS = k; });
      a.forEach((v, k) => {
        if (v <= 0) return; let h = ph * v / hi; const gap = y < Y(0) && h > 4 ? 2 : 0; const y1 = y - gap, y0 = y - h; y = y0; h = y1 - y0; if (h < .5) return;
        if (k === topS) { const r = Math.min(4, bw / 2, h); sv('path', { d: `M${x} ${y1}V${y0 + r}Q${x} ${y0} ${x + r} ${y0}H${x + bw - r}Q${x + bw} ${y0} ${x + bw} ${y0 + r}V${y1}Z`, class: o.series[k].cls }, svg); }
        else sv('rect', { x, y: y0, width: bw, height: h, class: o.series[k].cls }, svg);
      });
    });
    (o.guides || []).forEach(q => { sv('line', { x1: m.l, x2: W - m.r, y1: Y(q.v), y2: Y(q.v), class: 'guide' }, svg); });
    hover(svg, ev => {
      const i = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - svg.getBoundingClientRect().left - m.l) / sw)));
      hv.setAttribute('x', m.l + sw * i); hv.setAttribute('visibility', 'visible');
      const rows = o.series.map((se, k) => ({ v: o.fmt(o.stacks[i][k]), k: se.name, c: o.series.length > 1 ? se.c : null })).filter((r, k) => o.series.length === 1 || o.stacks[i][k] > 0);
      if (o.series.length > 1) rows.push({ v: o.fmt(tot[i]), k: 'total' });
      showTip(ev, 'Week of ' + dstr(o.starts[i]), rows);
    }, () => hv.setAttribute('visibility', 'hidden'));
    host.replaceChildren(svg);
  }

  // Calendar: one cell per day, weeks as columns.
  function calendar(host, o) {
    const W = host.clientWidth, left = 18, top = 16, n = o.dates.length, row = d => (d.getUTCDay() + 6) % 7, off = row(o.dates[0]);
    const cols = Math.ceil((n + off) / 7), cs = Math.min(17, (W - left) / cols), gap = cs > 8 ? 2 : 1, H = top + 7 * cs;
    const svg = sv('svg', { width: W, height: H, role: 'img', 'aria-label': o.label });
    ['M', '', 'W', '', 'F', '', 'S'].forEach((t, r) => { if (t) tx(svg, 0, top + r * cs + cs / 2 + 3.5, t); });
    const mo = []; o.dates.forEach((d, i) => { if (d.getUTCDate() === 1) mo.push({ x: left + Math.floor((i + off) / 7) * cs + cs / 2, t: MON[d.getUTCMonth()] }); });
    xLabels(svg, mo, 10, W + 20);
    o.dates.forEach((d, i) => {
      const v = o.y[i], c = v == null ? 0 : 1 + o.bins.filter(b => v >= b).length;
      sv('rect', { x: left + Math.floor((i + off) / 7) * cs, y: top + row(d) * cs, width: cs - gap, height: cs - gap, rx: Math.min(3, cs / 4), class: 'c' + c }, svg);
    });
    const hl = sv('rect', { width: cs - gap, height: cs - gap, rx: Math.min(3, cs / 4), class: 'cellhov', visibility: 'hidden' }, svg);
    hover(svg, ev => {
      const b = svg.getBoundingClientRect(), c = Math.floor((ev.clientX - b.left - left) / cs), r = Math.floor((ev.clientY - b.top - top) / cs), i = c * 7 + r - off;
      if (c < 0 || r < 0 || r > 6 || i < 0 || i >= n) { tip.hidden = true; hl.setAttribute('visibility', 'hidden'); return; }
      hl.setAttribute('x', left + c * cs); hl.setAttribute('y', top + r * cs); hl.setAttribute('visibility', 'visible');
      showTip(ev, dstr(o.dates[i]), [{ v: o.fmt(o.y[i]), k: o.unit }]);
    }, () => hl.setAttribute('visibility', 'hidden'));
    host.replaceChildren(svg);
  }

  // Floating bars from one value to another: bed to wake time, or lower to upper blood pressure.
  function rangeChart(host, o) {
    const W = host.clientWidth, H = o.h || 180, m = { l: o.ml || 36, r: 8, t: 10, b: 20 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const svg = sv('svg', { width: W, height: H, role: 'img', 'aria-label': o.label });
    const lo = o.ticks[0], hi = o.ticks[o.ticks.length - 1], Y = v => m.t + ph * (o.invert ? (v - lo) / (hi - lo) : 1 - (v - lo) / (hi - lo));
    const X = f => m.l + 6 + (pw - 12) * f, bw = Math.min(8, Math.max(2.5, (pw - 12) / o.items.length - 2));
    o.ticks.forEach(t => { sv('line', { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: 'gridl' }, svg); tx(svg, m.l - 6, Y(t) + 3.5, o.tick(t), 'ax', 'end'); });
    xLabels(svg, o.xl.map(q => ({ x: X(q.f), t: q.t })), H - 4, W, o.xgap);
    const hv = sv('rect', { y: m.t, height: ph, width: bw + 6, rx: 4, class: 'hov', visibility: 'hidden' }, svg);
    o.items.forEach(it => { const ya = Y(it.a), yb = Y(it.b); sv('rect', { x: X(it.f) - bw / 2, y: Math.min(ya, yb), width: bw, height: Math.abs(yb - ya), rx: bw / 2, class: 'f1' }, svg); });
    (o.guides || []).forEach(q => { sv('line', { x1: m.l, x2: W - m.r, y1: Y(q.v), y2: Y(q.v), class: 'guide' }, svg); });
    hover(svg, ev => {
      const px = ev.clientX - svg.getBoundingClientRect().left; let b = o.items[0]; for (const it of o.items) if (Math.abs(X(it.f) - px) < Math.abs(X(b.f) - px)) b = it;
      hv.setAttribute('x', X(b.f) - bw / 2 - 3); hv.setAttribute('visibility', 'visible'); showTip(ev, b.head, b.rows);
    }, () => hv.setAttribute('visibility', 'hidden'));
    host.replaceChildren(svg);
  }

  // One whole split into parts.
  function segBar(host, parts) {
    const tot = parts.reduce((s, p) => s + p.v, 0), bar = div('segbar');
    parts.forEach(p => { const d = div('', p.v / tot >= .09 ? Math.round(100 * p.v / tot) + '%' : ''); d.style.cssText = `flex:${p.v} 1 0;background:var(--st-${p.id});color:var(--on-${p.id})`; d.title = p.name + ': ' + p.text; bar.append(d); });
    host.replaceChildren(bar);
  }

  function spark(vals, cls) {
    const v = vals.filter(x => x != null), lo = Math.min(...v), hi = Math.max(...v), Y = x => 26 - 22 * (hi > lo ? (x - lo) / (hi - lo) : .5);
    return `<span class="spark ${cls || ''}" aria-hidden="true"><svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="${v.map((x, i) => (i ? 'L' : 'M') + (100 * i / (v.length - 1)).toFixed(1) + ' ' + Y(x).toFixed(1)).join('')}"/></svg><i style="top:${(Y(v[v.length - 1]) / 30 * 100).toFixed(1)}%"></i></span>`;
  }

  /* ================= page ================= */
  const RT = { good: 'Good', watch: 'Keep an eye on it', act: 'Act', none: 'No data or no access' };
  const pill = (r, count) => `<span class="pill ${r}"><svg aria-hidden="true"><use href="#r-${r}"/></svg>${count != null ? `<b>${count}</b>` : ''}${RT[r]}</span>`;
  const main = document.getElementById('main'), charts = [];
  let cur = RUNS.length - 1;

  function monthly(dates, vals, f) {
    const mp = new Map(); dates.forEach((d, i) => { if (vals[i] == null) return; const k = MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); if (!mp.has(k)) mp.set(k, []); mp.get(k).push(vals[i]); });
    return { head: ['Month', 'Average', 'Lowest', 'Highest'], rows: [...mp].map(([k, a]) => [k, f(mean(a)), f(Math.min(...a)), f(Math.max(...a))]) };
  }
  function tableEl(t) {
    const tb = document.createElement('table'), hr = tb.createTHead().insertRow(); t.head.forEach(h => { const th = document.createElement('th'); th.textContent = h; hr.append(th); });
    const body = tb.createTBody(); t.rows.forEach(r => { const tr = body.insertRow(); r.forEach(c => { tr.insertCell().textContent = c; }); }); return tb;
  }
  const LEG = { line: n => `<span><i class="k-line"></i>${n}</span>`, dot: n => `<span><i class="k-dot"></i>${n}</span>`, band: n => `<span><i class="k-band"></i>${n}</span>`, guide: n => `<span><i class="k-guide"></i>${n}</span>`, sw: (n, c) => `<span><i class="k-sw" style="background:${c}"></i>${n}</span>` };

  function chartCard(grid, o) {
    const c = div('card' + (o.wide ? ' wide' : ''), `<div class="ch"><div><h3>${o.title}</h3><div class="num"><b>${o.value}</b><span class="u">${o.unit || ''}</span>${o.delta || ''}</div></div><button class="tb" type="button" aria-expanded="false">Values</button></div>${o.note ? `<p class="note">${o.note}</p>` : ''}<div class="plot"></div><div class="legend">${(o.legend || []).join('')}</div><div class="tbl" hidden></div>`);
    const host = c.querySelector('.plot'), tbl = c.querySelector('.tbl'), btn = c.querySelector('.tb');
    btn.addEventListener('click', () => { if (!tbl.firstChild) tbl.append(tableEl(o.table())); tbl.hidden = !tbl.hidden; btn.setAttribute('aria-expanded', String(!tbl.hidden)); });
    grid.append(c); charts.push(() => o.draw(host));
  }
  function section(id, name, rating, text) {
    main.append(div('sec-head', `<h2 class="sec">${name}</h2>${pill(rating)}<p>${text}</p>`)); main.lastChild.id = id;
    const gr = div('grid2'); main.append(gr); return gr;
  }

  function render(ri) {
    cur = ri; charts.length = 0; main.replaceChildren();
    const A = analyse(ri), P = ri ? analyse(ri - 1) : null, runDate = date(A.e), D = A.dates;
    const dl = (key, good, f, tol) => {
      if (!P) return ''; const d = A[key] - P[key];
      if (Math.abs(d) < tol) return '<span class="delta">no change</span>';
      return `<span class="delta ${(d > 0) === (good > 0) ? 'better' : 'worse'}"><i>${d > 0 ? '▲' : '▼'}</i>${f(Math.abs(d))}</span>`;
    };
    const wkv = a => A.wk.map(w => A.wmean(a, w));
    const std3 = [{ t: 'line', n: '7-day average' }, { t: 'dot', n: 'single days' }, { t: 'band', n: 'your usual range' }].map(q => LEG[q.t](q.n));
    const usual = (a, f) => { const b = A.band(a); return { b, text: f(b[0]) + ' to ' + f(b[1]) }; };

    /* ----- hero and overview ----- */
    const areas = [
      { id: 'activity', name: 'Activity', r: 'good', v: int(A.steps), u: 'steps per day', d: dl('steps', 1, int, 100), s: wkv(M.steps) },
      { id: 'heart', name: 'Heart and fitness', r: 'watch', v: int(A.rhr), u: 'bpm at rest', d: dl('rhr', -1, f1, .3), s: wkv(M.rhr) },
      { id: 'sleep', name: 'Sleep', r: 'act', v: hm(A.sleep).replace(' min', ''), u: 'per night', d: dl('sleep', 1, x => Math.round(x * 60) + ' min', .05), s: wkv(M.sleep) },
      { id: 'training', name: 'Training', r: 'good', v: f1(A.wo), u: 'sessions per week', d: dl('wo', 1, f1, .15), s: A.wk.map(w => A.wsum(M.wo.map(o => o.run + o.ride + o.str + o.oth), w)) },
      { id: 'body', name: 'Body', r: 'watch', v: f1(A.weight), u: 'kg', d: dl('weight', -1, x => f1(x) + ' kg', .2), s: wkv(M.weight) },
      { id: 'mobility', name: 'Mobility', r: 'good', v: f1(A.speed), u: 'km/h walking', d: dl('speed', 1, f1, .05), s: wkv(M.speed) },
      { id: 'hearing', name: 'Hearing and environment', r: 'good', v: int(A.db), u: 'dB headphones', d: dl('db', -1, f1, .5), s: wkv(M.db) },
      { id: 'mind', name: 'Mind', r: 'none' }
    ];
    const count = r => areas.filter(a => a.r === r).length;
    const hero = div('hero', `<h1>Good overall: you move a lot and your heart values are steady. Sleep is the area to work on.</h1>
      <p class="meta">Run of ${dstr(runDate)} · ${dstr(D[0])} to ${dstr(runDate)} (12 months)${P ? ' · changes since the run of ' + dstr(date(P.e)) : ' · first run'}</p>
      <div class="tally"><span class="blocks" aria-hidden="true">${['good', 'watch', 'act', 'none'].map(r => `<i class="${r}" style="background:var(--c)"></i>`.repeat(count(r))).join('')}</span>${['good', 'watch', 'act', 'none'].map(r => pill(r, count(r))).join('')}</div>`);
    main.append(hero);
    const tiles = div('tiles');
    areas.forEach(a => {
      const t = document.createElement('a'); t.className = 'card tile'; t.href = '#' + a.id;
      t.innerHTML = `<h3>${a.name}</h3>${pill(a.r)}` + (a.r === 'none' ? '<div class="empty">No records in the files</div>' : `<div class="num"><b>${a.v}</b><span class="u">${a.u}</span>${a.d}</div>${spark(a.s)}`);
      tiles.append(t);
    });
    main.append(tiles);

    /* ----- points for the doctor ----- */
    main.append(div('card doctor', `<svg aria-hidden="true"><use href="#i-doc"/></svg><div><h2>Worth raising with a doctor</h2><ul>
      <li>Blood pressure: ${int(A.sys)}/${int(A.dia)} mmHg on average over ${A.bp.length} readings, ${A.bpHigh} of them at or above 130/80.</li>
      <li>One ECG recording on 14 Mar 2026 was classified as atrial fibrillation by Apple Watch.</li></ul></div>`));

    /* ----- recommendations ----- */
    main.append(div('sec-head', `<h2 class="sec">What to do next</h2>`)); main.lastChild.id = 'next-steps';
    const startKg = M.weight.slice(0, 30).filter(v => v != null)[0];
    const recs = [
      { text: 'Be in bed by 23:00 on work nights.', key: 'sleep', dir: 1, tol: .08, now: [hm(A.sleep), ''], target: ['7 h 00 min', ''], prog: A.sleep / 7, s: wkv(M.sleep) },
      { text: 'Add two short strength sessions per week.', key: 'str', dir: 1, tol: .15, now: [f1(A.str), 'per week'], target: ['2', 'per week'], prog: A.str / 2, s: A.wk.map((w, i) => mean(A.wk.slice(Math.max(0, i - 7), i + 1).map(q => A.sessions(q, 'str')))) },
      { text: 'Keep losing about half a kilogram per month.', key: 'weight', dir: -1, tol: .25, now: [f1(A.weight), 'kg'], target: [GOAL_KG, 'kg'], prog: (startKg - A.weight) / (startKg - GOAL_KG), s: wkv(M.weight) },
      { text: 'Measure your blood pressure at home twice a week.', key: 'bp30', dir: 1, tol: 1, now: [A.bp30, 'in 30 days'], target: ['8', 'in 30 days'], prog: A.bp30 / 8, s: A.wk.map(w => BP.filter(b => b.i > w.b - 56 && b.i <= w.b).length) }
    ];
    const rg = div('recs');
    recs.forEach((r, i) => {
      let chip = '';
      if (P) {
        const d = (A[r.key] - P[r.key]) * r.dir, st = d >= r.tol ? ['good', '↗', 'Improved'] : d <= -r.tol ? ['watch', '↘', 'Worse'] : ['none', '→', 'Unchanged'];
        chip = `<span class="chip ${st[0]}"><i>${st[1]}</i>${st[2]} <span>since ${dshort(date(P.e))}</span></span>`;
      }
      rg.append(div('card rec', `<div class="rec-top"><span class="rec-n">${i + 1}</span><p>${r.text}</p></div>
        <div class="rec-nums"><div><span>Now</span><b>${r.now[0]}</b> <small>${r.now[1]}</small></div><div><span>Target</span><b>${r.target[0]}</b> <small>${r.target[1]}</small></div>${spark(r.s)}</div>
        <div class="meter" role="img" aria-label="${Math.round(100 * Math.max(0, Math.min(1, r.prog)))} percent of the way to the target"><i style="width:${(100 * Math.max(.02, Math.min(1, r.prog))).toFixed(0)}%"></i></div>${chip}`));
    });
    main.append(rg);

    /* ----- activity ----- */
    let gr = section('activity', 'Activity', 'good', 'You reach the weekly activity guideline in most weeks.');
    const steps = A.sl(M.steps), exw = A.wk.map(w => A.wsum(M.exmin, w));
    chartCard(gr, {
      title: 'Steps per day', value: int(A.steps), unit: 'on average, last 30 days', delta: dl('steps', 1, int, 100),
      legend: ['under 4,000', '4,000 and more', '6,000 and more', '8,000 and more', '10,000 and more'].map((n, i) => LEG.sw(n, `var(--q${i + 1})`)),
      draw: h => calendar(h, { label: 'Steps per day as a calendar', dates: D, y: steps, bins: [4000, 6000, 8000, 10000], fmt: int, unit: 'steps' }),
      table: () => monthly(D, steps, int)
    });
    chartCard(gr, {
      title: 'Exercise minutes per week', value: int(A.exmin), unit: 'min per week, last 12 weeks', delta: dl('exmin', 1, int, 5),
      note: `${exw.filter(v => v >= 150).length} of 52 weeks reached 150 minutes.`, legend: [LEG.guide('guideline: 150 min per week')],
      draw: h => barChart(h, { label: 'Exercise minutes per week', starts: A.wk.map(w => w.start), stacks: exw.map(v => [v]), series: [{ name: 'min', cls: 'f1' }], fmt: int, guides: [{ v: 150 }] }),
      table: () => ({ head: ['Week of', 'Minutes'], rows: A.wk.map((w, i) => [dstr(w.start), int(exw[i])]) })
    });

    /* ----- heart and fitness ----- */
    gr = section('heart', 'Heart and fitness', 'watch', 'Heart rate and fitness are fine. The blood pressure readings are above the guideline.');
    const tipAvg = (roll, raw, f, unit) => b => [{ v: f(roll[b]) + ' ' + unit, k: '7-day average', c: 'var(--s1)' }, { v: f(raw[b]) + ' ' + unit, k: 'this day' }];
    const rhr = A.sl(M.rhr), rhrR = A.roll(M.rhr), uR = usual(rhrR, int);
    chartCard(gr, {
      title: 'Resting heart rate', value: int(A.rhr), unit: 'bpm, last 30 days', delta: dl('rhr', -1, f1, .3), note: `Your usual range is ${uR.text} bpm.`, legend: std3,
      draw: h => lineChart(h, { label: 'Resting heart rate over time', dates: D, y: rhrR, dots: rhr, band: uR.b, tip: tipAvg(rhrR, rhr, f1, 'bpm') }),
      table: () => monthly(D, rhr, f1)
    });
    const hrv = A.sl(M.hrv), hrvR = A.roll(M.hrv), uH = usual(hrvR, int);
    chartCard(gr, {
      title: 'Heart rate variability', value: int(A.hrv), unit: 'ms, last 30 days', delta: dl('hrv', 1, f1, 1), note: `Your usual range is ${uH.text} ms.`, legend: std3,
      draw: h => lineChart(h, { label: 'Heart rate variability over time', dates: D, y: hrvR, dots: hrv, band: uH.b, tip: tipAvg(hrvR, hrv, f1, 'ms') }),
      table: () => monthly(D, hrv, f1)
    });
    const vo2 = A.sl(M.vo2);
    chartCard(gr, {
      title: 'Cardio fitness (VO2 max)', value: f1(A.vo2), unit: 'ml/kg/min, last 30 days', delta: dl('vo2', 1, f1, .2),
      draw: h => lineChart(h, { label: 'VO2 max over time', dates: D, y: vo2, guides: [{ v: 38, label: 'average for your age 38' }], tip: b => [{ v: f1(vo2[b]) + ' ml/kg/min', k: '' }] }),
      table: () => monthly(D, vo2, f1)
    });
    chartCard(gr, {
      title: 'Blood pressure', value: int(A.sys) + '/' + int(A.dia), unit: `mmHg, ${A.bp.length} readings`, note: `${A.bpHigh} of ${A.bp.length} readings were at or above 130/80.`, legend: [LEG.guide('guideline: below 130 (upper value) and below 80 (lower value)')],
      draw: h => rangeChart(h, {
        label: 'Blood pressure readings', ticks: [60, 80, 100, 120, 140, 160], tick: String, xl: months(D, i => i / 364).map(q => ({ f: q.x, t: q.t })),
        items: A.bp.map(b => ({ f: (b.i - A.s) / 364, a: b.dia, b: b.sys, head: dstr(date(b.i)), rows: [{ v: b.sys + '/' + b.dia + ' mmHg', k: '' }] })),
        guides: [{ v: 130 }, { v: 80 }]
      }),
      table: () => ({ head: ['Date', 'Upper', 'Lower'], rows: A.bp.map(b => [dstr(date(b.i)), b.sys, b.dia]) })
    });

    /* ----- sleep ----- */
    gr = section('sleep', 'Sleep', 'act', 'You sleep too little, and bedtimes at the weekend are about an hour later.');
    const sl = A.sl(M.sleep), slR = A.roll(M.sleep), uS = usual(slR, hm);
    chartCard(gr, {
      title: 'Sleep per night', value: hm(A.sleep), unit: 'last 30 days', delta: dl('sleep', 1, x => Math.round(x * 60) + ' min', .05), legend: std3,
      draw: h => lineChart(h, { label: 'Sleep per night over time', dates: D, y: slR, dots: sl, band: uS.b, tick: t => t + ' h', guides: [{ v: 7, label: 'guideline 7 h' }], tip: b => [{ v: hm(slR[b]), k: '7-day average', c: 'var(--s1)' }, { v: hm(sl[b]), k: 'this night' }] }),
      table: () => monthly(D, sl, hm)
    });
    const nights = []; for (let i = A.e - 55; i <= A.e; i++) nights.push(i);
    chartCard(gr, {
      title: 'Bed and wake times, last 8 weeks', value: clock(A.bed) + ' to ' + clock(A.wake), unit: 'on average',
      draw: h => rangeChart(h, {
        label: 'Bed and wake times per night', ml: 40, invert: true, ticks: [3, 6, 9, 12, 15], tick: t => clock(t + 18),
        xgap: 46, xl: nights.map((i, k) => k % 7 === 6 ? { f: k / 55, t: dshort(date(i)) } : null).filter(Boolean),
        items: nights.map((i, k) => ({ f: k / 55, a: M.bed[i] - 18, b: M.wake[i] + 6, head: 'Night of ' + dstr(date(i)), rows: [{ v: clock(M.bed[i]) + ' to ' + clock(M.wake[i]), k: '' }, { v: hm(M.sleep[i]), k: 'asleep' }] }))
      }),
      table: () => ({ head: ['Night of', 'To bed', 'Woke up', 'Asleep'], rows: nights.map(i => [dstr(date(i)), clock(M.bed[i]), clock(M.wake[i]), hm(M.sleep[i])]) })
    });
    const last30 = a => mean(a.slice(A.e - 29, A.e + 1)), deep = last30(M.deep), rem = last30(M.rem), awk = last30(M.awake), core = A.sleep - deep - rem;
    const stages = [{ id: 'deep', name: 'Deep', v: deep }, { id: 'core', name: 'Core', v: core }, { id: 'rem', name: 'REM', v: rem }, { id: 'awake', name: 'Awake', v: awk }].map(p => Object.assign(p, { text: hm(p.v) }));
    chartCard(gr, {
      wide: true, title: 'An average night, last 30 days', value: hm(A.sleep + awk), unit: 'in bed',
      legend: stages.map(p => LEG.sw(p.name + ' ' + p.text, `var(--st-${p.id})`)),
      draw: h => segBar(h, stages),
      table: () => ({ head: ['Stage', 'Time', 'Share'], rows: stages.map(p => [p.name, p.text, Math.round(100 * p.v / (A.sleep + awk)) + '%']) })
    });

    /* ----- training ----- */
    gr = section('training', 'Training', 'good', 'Regular endurance training. Strength training is rare.');
    const kinds = [{ k: 'run', name: 'Running', cls: 'f1', c: 'var(--s1)' }, { k: 'ride', name: 'Cycling', cls: 'f2', c: 'var(--s2)' }, { k: 'str', name: 'Strength', cls: 'f3', c: 'var(--s3)' }, { k: 'oth', name: 'Other', cls: 'f4', c: 'var(--s4)' }];
    const tw = A.wk.map(w => kinds.map(q => A.wsum(M.wo.map(o => o[q.k]), w)));
    chartCard(gr, {
      wide: true, title: 'Training minutes per week', value: f1(A.wo), unit: 'sessions per week, last 12 weeks', delta: dl('wo', 1, f1, .15),
      note: `${f1(A.str)} strength sessions per week. The guideline is 2.`, legend: kinds.map(q => LEG.sw(q.name, q.c)),
      draw: h => barChart(h, { label: 'Training minutes per week by kind', h: 200, starts: A.wk.map(w => w.start), stacks: tw, series: kinds, fmt: v => int(v) + ' min' }),
      table: () => ({ head: ['Week of'].concat(kinds.map(q => q.name)), rows: A.wk.map((w, i) => [dstr(w.start)].concat(tw[i].map(int))) })
    });

    /* ----- body ----- */
    gr = section('body', 'Body', 'watch', 'Your weight is falling towards your goal. It is still slightly above the healthy range.');
    const kg = A.sl(M.weight);
    chartCard(gr, {
      wide: true, title: 'Weight', value: f1(A.weight), unit: `kg · BMI ${f1(A.weight / HEIGHT / HEIGHT)}`, delta: dl('weight', -1, x => f1(x) + ' kg', .2),
      draw: h => lineChart(h, { label: 'Weight over time', h: 200, dates: D, y: kg, guides: [{ v: GOAL_KG, label: 'your goal 80 kg' }], tip: b => [{ v: f1(kg[b]) + ' kg', k: '' }] }),
      table: () => monthly(D, kg, f1)
    });

    /* ----- mobility ----- */
    gr = section('mobility', 'Mobility', 'good', 'You walk fast and evenly.');
    const sp = A.sl(M.speed), spR = A.roll(M.speed), uP = usual(spR, f1);
    chartCard(gr, {
      title: 'Walking speed', value: f1(A.speed), unit: 'km/h, last 30 days', delta: dl('speed', 1, f1, .05), legend: std3,
      draw: h => lineChart(h, { label: 'Walking speed over time', dates: D, y: spR, dots: sp, band: uP.b, tip: tipAvg(spR, sp, x => x.toFixed(2), 'km/h') }),
      table: () => monthly(D, sp, x => x.toFixed(2))
    });
    const as = A.sl(M.asym), asR = A.roll(M.asym), uA = usual(asR, f1);
    chartCard(gr, {
      title: 'Walking asymmetry', value: f1(A.asym), unit: '%, last 30 days', delta: dl('asym', -1, f1, .2), legend: std3,
      draw: h => lineChart(h, { label: 'Walking asymmetry over time', dates: D, y: asR, dots: as, band: uA.b, tip: tipAvg(asR, as, f1, '%') }),
      table: () => monthly(D, as, f1)
    });

    /* ----- hearing and environment ----- */
    gr = section('hearing', 'Hearing and environment', 'good', 'Headphone volume stays below the limit.');
    const db = A.sl(M.db), dbR = A.roll(M.db), uD = usual(dbR, int);
    chartCard(gr, {
      title: 'Headphone volume', value: int(A.db), unit: 'dB, last 30 days', delta: dl('db', -1, f1, .5), legend: std3,
      draw: h => lineChart(h, { label: 'Headphone volume over time', dates: D, y: dbR, dots: db, band: uD.b, guides: [{ v: 80, label: 'limit 80 dB' }], tip: b => [{ v: f1(dbR[b]) + ' dB', k: '7-day average', c: 'var(--s1)' }].concat(db[b] != null ? [{ v: f1(db[b]) + ' dB', k: 'this day' }] : []) }),
      table: () => monthly(D, db, f1)
    });
    const lw = A.wk.map(w => A.wmean(M.light, w));
    chartCard(gr, {
      title: 'Time in daylight', value: int(A.light), unit: 'min per day, last 30 days', delta: dl('light', 1, int, 3),
      draw: h => barChart(h, { label: 'Time in daylight per week', starts: A.wk.map(w => w.start), stacks: lw.map(v => [v]), series: [{ name: 'min per day', cls: 'f1' }], fmt: int }),
      table: () => ({ head: ['Week of', 'Minutes per day'], rows: A.wk.map((w, i) => [dstr(w.start), int(lw[i])]) })
    });

    /* ----- mind ----- */
    gr = section('mind', 'Mind', 'none', '');
    gr.append(div('card nodata wide', `<svg aria-hidden="true"><use href="#r-none"/></svg><span>The files hold no mindfulness or state of mind records. This can mean that nothing was recorded or that Health50 was not allowed to read it.</span>`));

    /* ----- footer ----- */
    const ft = document.createElement('footer');
    ft.innerHTML = `<strong>This analysis is not medical advice. It makes no diagnosis.</strong>
      <ul><li>Activity and strength training: WHO guidelines on physical activity and sedentary behaviour, 2020</li>
      <li>Sleep: consensus statement of the American Academy of Sleep Medicine and the Sleep Research Society, 2015</li>
      <li>Blood pressure: ACC/AHA guideline for high blood pressure in adults, 2017</li>
      <li>Weight: WHO body mass index classification</li>
      <li>Cardio fitness: FRIEND registry reference values by age and sex</li>
      <li>Headphone volume: WHO-ITU standard for safe listening devices, 2019</li></ul>`;
    main.append(ft);

    charts.forEach(f => f());
    sel.value = String(ri); prev.disabled = ri === 0; next.disabled = ri === RUNS.length - 1;
  }

  /* ================= controls ================= */
  const sel = document.getElementById('runsel'), prev = document.getElementById('prev'), next = document.getElementById('next');
  RUNS.forEach((r, i) => { const o = document.createElement('option'); o.value = i; o.textContent = dstr(date(r.i)); sel.prepend(o); });
  sel.addEventListener('change', () => render(+sel.value));
  prev.addEventListener('click', () => render(cur - 1));
  next.addEventListener('click', () => render(cur + 1));

  const ap = document.getElementById('appearance');
  const mark = () => ap.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === document.documentElement.dataset.pref));
  ap.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { window.setAppearance(b.dataset.v); mark(); } });
  mark();

  let lastW = 0, raf = 0;
  new ResizeObserver(() => { const w = main.clientWidth; if (w === lastW) return; lastW = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => charts.forEach(f => f())); }).observe(main);

  const q = +new URLSearchParams(location.search).get('run');
  render(q >= 1 && q <= RUNS.length ? q - 1 : RUNS.length - 1);
})();
</script>
</body>
</html>
